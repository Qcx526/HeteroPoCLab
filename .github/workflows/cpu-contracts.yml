name: CPU domain contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: Python ${{ matrix.python }} CPU contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and check tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples/m0a
      - name: Format
        run: ruff format --check src tests examples/m0a
      - name: Types
        run: mypy
      - name: Offline deterministic tests
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest
      - name: Build installable distributions
        run: python -m build --outdir output/m0a/dist
